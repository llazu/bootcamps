<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Rubik" rel="stylesheet">
    <title>HTML Forms</title>
  </head>
  <body>
    <section id="overlay">
      <img src="https://content.codecademy.com/courses/web-101/unit-6/htmlcss1-img_burger-logo.svg" alt="Davie's Burgers Logo" id="logo">
      <hr>
      <form>
        <h1>Create a burger!</h1>
        <section class="protein">
          <label for="patty">Select your protein?</label>
          <br>
          <input name="patty" id="patty" type="text" value="beef">
          <br>
        </section>
        <section id="amount">
        <label for="quant">How many patties?</label>
        <br>
        <input name="quant" id="quant" type="number" step="1">
        </section>
        <section class="cooked">
          <label for="doneness">How do you like burger?</label>
          <br>
          <span>Rare</span>
          <input id="doneness" name="doneness" type="range" min="0" max="5" step="0.5">
        </section>
      </form>
    </section>
  </body>
</html>
