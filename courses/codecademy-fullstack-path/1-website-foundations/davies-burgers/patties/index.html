<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Rubik" rel="stylesheet">
    <title>HTML Forms</title>
  </head>
  <body>
    <section id="overlay">
      <img src="https://content.codecademy.com/courses/web-101/unit-6/htmlcss1-img_burger-logo.svg" alt="Davie's Burgers Logo" id="logo">
      <hr>
      <form>
        <h1>Create a burger!</h1>
        <section class="protein">
          <label for="patty">Select your protein?</label>
          <br>
          <input name="patty" id="patty" type="text" value="beef">
          <br>
        </section>
        <section id="amount">
        <label for="quant">How many patties?</label>
        <br>
        <input name="quant" id="quant" type="number" step="1">
        </section>
        <section class="cooked">
          <label for="doneness">How do you like burger?</label>
          <br>
          <span>Rare</span>
          <input id="doneness" name="doneness" type="range" min="0" max="5" step="0.5">
          <span>Well Done</span>
        </section>
        <section class="topping">
          <p>Select your toppings</p>
          <input id="lettuce" name="topping" type="checkbox" value="lettuce">
          <label for="lettuce">Lettuce</label>
          <input id="tomato" name="topping" type="checkbox" value="tomato">
          <label for="tomato">Tomato</label>
          <input id="onion" name="topping" type="checkbox" value="onion">
          <label for="onion">Onion</label>
        </section>
        <section class="cheesy">
          <p>Would you like cheese?</p>
          <input id="yes" type="radio" name="cheese" value="yes">
          <label for="yes">Yes</label>
          <input id="no" type="radio" name="cheese" value="no">
          <label for="no">No</label>
        </section>
        <section class="bread">
          <label for="bun-type">Select bread type.</label>
          <select id="bun-type" name="bread">
            <option value="sesame">Sesame</option>
            <option value="potato">Potato</option>
            <option value="Wonder Bread">Wonder Bread</option>
          </select>
        </section>
        <section class="sauce-selection">
          <label for="sauce">Select your sauce</label>
          <input type="text" list="sauces" id="sauce" name="sauce">
          <datalist id="sauces">
            <option value="Ketchup"></option>
            <option value="mayo"></option>
            <option value="mustard"></option>
          </datalist>
        </section>
        <section class="extra-info">
          <label for="extra">Need anything else</label>
          <br>
          <textarea id="extra" name="extra" rows="3" cols="40">
            Burger patty
          </textarea>
        </section>
        <section class="submission">
          <input type="submit">
        </section>
      </form>
    </section>
  </body>
</html>
